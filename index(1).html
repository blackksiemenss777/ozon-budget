/* v3 layout fixes */
.table-wrap::-webkit-scrollbar,.tabs::-webkit-scrollbar{height:12px;width:12px}
.table-wrap::-webkit-scrollbar-thumb,.tabs::-webkit-scrollbar-thumb{background:#34577b;border-radius:8px;border:2px solid #0d1a2a}
.table-wrap::-webkit-scrollbar-track,.tabs::-webkit-scrollbar-track{background:#0a1625}
.work-table thead th{position:sticky;top:0;z-index:5}
.work-table .filter-row th{top:29px;z-index:4}
@media(max-height:800px){
  .app{padding-top:6px;padding-bottom:6px}
  .logo{width:36px;height:36px}
  .brand h1{font-size:18px}
  .btn{padding:6px 8px;font-size:12px}
  .tab{padding:6px 10px}
  .kpi{padding:5px 7px}
  .kpi .value{font-size:15px}
  .panel-head{padding:6px 8px}
}


/* v4: compact working table */
.work-table-wrap{overflow-x:hidden}
@media(max-width:1180px){
  .work-table{min-width:0 !important;width:100% !important}
  .work-table-wrap{overflow-x:hidden !important}
  .work-table th,.work-table td{padding-left:2px;padding-right:2px;font-size:9.8px}
  .work-table .badge{font-size:8.8px;padding:3px 4px}
}


/* v5: scrolling on all sheets except Work */
.scroll-view{
  overflow-x:hidden !important;
  overflow-y:auto !important;
  min-width:0;
  min-height:0;
  padding-bottom:10px;
  scrollbar-gutter:stable;
}
.scroll-view > .panel{
  min-width:0;
}
.scroll-view .table-wrap{
  overflow-x:auto !important;
  overflow-y:auto !important;
  width:100%;
  max-width:100%;
  max-height:calc(100dvh - 150px);
  min-height:220px;
  scrollbar-gutter:stable both-edges;
}
.scroll-view table{
  width:max-content;
  min-width:100%;
}
.scroll-view::-webkit-scrollbar,
.scroll-view .table-wrap::-webkit-scrollbar{
  width:12px;
  height:12px;
}
.scroll-view::-webkit-scrollbar-thumb,
.scroll-view .table-wrap::-webkit-scrollbar-thumb{
  background:#34577b;
  border-radius:8px;
  border:2px solid #0d1a2a;
}
.scroll-view::-webkit-scrollbar-track,
.scroll-view .table-wrap::-webkit-scrollbar-track{
  background:#0a1625;
}

/* Work sheet remains fitted to one screen */
.work-view{
  overflow:hidden !important;
}


/* v6: targeted scrolling fixes */

/* All non-work tables */
.scroll-view .table-wrap{
  overflow-x:auto !important;
  overflow-y:auto !important;
  max-width:100% !important;
  width:100% !important;
  scrollbar-gutter:stable both-edges;
}

/* Week sheets need a real minimum width so horizontal scrollbar appears */
.scroll-view .week-table{
  width:max-content !important;
  min-width:1450px !important;
}

/* Fallback: week tables currently have no dedicated class, target rows with 14 columns */
.scroll-view table:not(.work-table):has(thead tr:first-child th:nth-child(14)){
  width:max-content !important;
  min-width:1450px !important;
}

/* Dynamics: fit exactly to monitor width, only vertical scrolling */
#dynamics-fit-marker{display:none}
.scroll-view .dynamics-fit{
  overflow-x:hidden !important;
}
.scroll-view .dynamics-fit table{
  width:100% !important;
  min-width:0 !important;
  table-layout:fixed !important;
}
.scroll-view .dynamics-fit th,
.scroll-view .dynamics-fit td{
  white-space:normal !important;
  overflow-wrap:anywhere;
  padding:6px 5px;
  font-size:11px;
}

/* Settings and AI: scroll the entire content vertically */
.scroll-view.settings-view,
.scroll-view.ai-view{
  overflow-y:auto !important;
  overflow-x:hidden !important;
  padding-right:4px;
}
.scroll-view.settings-view .settings-grid,
.scroll-view.ai-view .cards{
  flex:0 0 auto;
}

/* visible scrollbars */
.scroll-view::-webkit-scrollbar,
.scroll-view .table-wrap::-webkit-scrollbar{
  width:12px;
  height:12px;
}


/* ===== v7: real per-tab scrolling ===== */

/* WORK: one-screen layout, no page scroll */
.work-view{
  overflow:hidden !important;
}
.work-view .work-panel{
  height:100%;
}

/* MATRIX / WEEKS / STOCKS:
   panel occupies the viewport and the TABLE itself scrolls in both directions */
.data-view{
  overflow:hidden !important;
}
.data-view > .panel{
  display:flex !important;
  flex-direction:column !important;
  flex:1 1 auto !important;
  height:100% !important;
  min-height:0 !important;
  min-width:0 !important;
}
.data-view > .panel > .table-wrap{
  flex:1 1 auto !important;
  min-height:0 !important;
  min-width:0 !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:scroll !important;
  overflow-y:scroll !important;
  scrollbar-gutter:stable both-edges !important;
}

/* Force a real horizontal overflow on every week, including Week 0 */
.data-view table.week-0,
.data-view table.week-1,
.data-view table.week-2,
.data-view table.week-3,
.data-view table.week-4{
  width:1500px !important;
  min-width:1500px !important;
}

/* Matrix / stocks may also be wider than a small display */
.data-view table.matrix-table{min-width:980px !important;width:max-content !important}
.data-view table.stocks-table{min-width:760px !important;width:max-content !important}

/* DYNAMICS: exactly monitor width, only vertical table scroll */
.dyn-view{
  overflow:hidden !important;
}
.dyn-view > .panel{
  display:flex !important;
  flex-direction:column !important;
  flex:1 1 auto !important;
  height:100% !important;
  min-height:0 !important;
  min-width:0 !important;
}
.dyn-view > .panel > .table-wrap{
  flex:1 1 auto !important;
  min-height:0 !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:hidden !important;
  overflow-y:scroll !important;
  scrollbar-gutter:stable !important;
}
.dyn-view table.dyn-table{
  width:100% !important;
  min-width:0 !important;
  table-layout:fixed !important;
}
.dyn-view table.dyn-table th,
.dyn-view table.dyn-table td{
  white-space:normal !important;
  overflow-wrap:anywhere !important;
  padding:5px 4px !important;
  font-size:10.5px !important;
  line-height:1.18 !important;
}
.dyn-view table.dyn-table .filter-row input{
  min-width:0 !important;
  width:100% !important;
  box-sizing:border-box !important;
  padding:3px 3px !important;
}

/* SETTINGS: scroll the whole tab vertically */
.settings-view{
  overflow-x:hidden !important;

    opacity:0;
    transform:
      translateY(7px);

    opacity:1;
    transform:none;
  }}

    opacity:0;
    transform:
      translateY(8px)
      scale(.995);
  }to{
    opacity:1;
    transform:none;
  }}

    opacity:0;

      translateY(8px)

    transform:none;
  }}

function calcProduct(p){

function getExcelFilterState(tab=activeTab){
  if(!state.excelFilters||typeof state.excelFilters!=='object')state.excelFilters={};
  if(!state.excelFilters[tab]||typeof state.excelFilters[tab]!=='object'){
    state.excelFilters[tab]={cols:{},sort:null,global:'',quickAction:'',quickMarker:'',kpiFilter:''};
  }
  if(typeof state.excelFilters[tab].kpiFilter!=='string')state.excelFilters[tab].kpiFilter='';
  if(!state.excelFilters[tab].cols)state.excelFilters[tab].cols={};
  return state.excelFilters[tab];
}
function tableCellValue(td){
  const control=td?.querySelector('input,select,textarea');
  const raw=control?control.value:(td?.textContent||'');
  const s=String(raw??'').trim();
  return s===''?'(Пустые)':s;
}
function numericFilterValue(s){
  const t=String(s??'').replace(/\u00a0/g,' ').replace(/\s/g,'')
    .replace('₽','').replace('%','').replace(',','.').replace(/[^\d.+-]/g,'');
  if(!t||t==='-'||t==='+'||t==='.')return null;
  const x=Number(t); return Number.isFinite(x)?x:null;
}
function ensureExcelFilterPopup(){
  let p=document.getElementById('excelFilterPopup');
  if(p)return p;
  p=document.createElement('div');
  p.id='excelFilterPopup';
  p.className='excel-filter-popup';
  document.body.appendChild(p);
  document.addEventListener('mousedown',e=>{
    if(!p.classList.contains('open'))return;
    if(p.contains(e.target)||e.target.closest('.excel-filter-btn'))return;
    p.classList.remove('open');
  });
  window.addEventListener('resize',()=>p.classList.remove('open'));
  return p;
}
function sortTableRows(table,col,dir){
  const body=table.tBodies[0]; if(!body)return;
  const rows=[...body.rows];
  rows.sort((a,b)=>{
    const av=tableCellValue(a.cells[col]), bv=tableCellValue(b.cells[col]);
    const an=numericFilterValue(av), bn=numericFilterValue(bv);
    let cmp;
    if(an!==null&&bn!==null)cmp=an-bn;
    else cmp=av.localeCompare(bv,'ru',{numeric:true,sensitivity:'base'});
    return dir==='desc'?-cmp:cmp;
  });
  const frag=document.createDocumentFragment();
  rows.forEach(r=>frag.appendChild(r));
  body.appendChild(frag);
}

  const isWork=table.classList.contains('work-table');

  const qmRaw=isWork?String(st.quickMarker||''):'';
  const qm=qmRaw?(qmRaw==='ОБЫЧНЫЙ'?'обычный':qmRaw.toLowerCase()):'';

  for(const tr of rows){
    const vals=[...tr.cells].map(tableCellValue);
    const all=vals.join(' ').toLowerCase();
    let ok=!global||all.includes(global);

    if(ok){
      for(const [idx,conf] of Object.entries(st.cols||{})){
        if(!conf||!Array.isArray(conf.values))continue;
        const val=vals[+idx]??'(Пустые)';
        if(!conf.values.includes(val)){ok=false;break;}
      }
    }
    if(ok&&qa&&!(vals[9]||'').toLowerCase().includes(qa))ok=false;
    if(ok&&qm&&!(vals[3]||'').toLowerCase().includes(qm))ok=false;
    if(ok&&isWork&&st.kpiFilter){
      const idx=Number(tr.dataset.row);
      const item=Number.isInteger(idx)?computed[idx]:null;
      if(!item||!matchesKpiFilter(item,st.kpiFilter))ok=false;
    }
    tr.hidden=!ok;
  }

  if(st.sort&&Number.isInteger(st.sort.col)&&st.sort.dir){
    sortTableRows(table,st.sort.col,st.sort.dir);
  }

  table.querySelectorAll('.excel-filter-btn').forEach(btn=>{
    const col=String(btn.dataset.filterCol);
    btn.classList.toggle('filtered',!!st.cols?.[col]);
    btn.classList.remove('sorted-asc','sorted-desc');
    if(st.sort&&String(st.sort.col)===col){
      btn.classList.add(st.sort.dir==='asc'?'sorted-asc':'sorted-desc');
    }
  });

  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
}
function openExcelFilterMenu(btn,table,panel,filterKey){
  const popup=ensureExcelFilterPopup();
  const col=+btn.dataset.filterCol;
  const st=getExcelFilterState(filterKey);
  const rows=table.tBodies[0]?[...table.tBodies[0].rows]:[];
  const values=[...new Set(rows.map(r=>tableCellValue(r.cells[col])))];
  values.sort((a,b)=>{
    const an=numericFilterValue(a),bn=numericFilterValue(b);
    if(an!==null&&bn!==null)return an-bn;
    return a.localeCompare(b,'ru',{numeric:true,sensitivity:'base'});
  });

  const existing=st.cols?.[String(col)]?.values;
  const selected=new Set(Array.isArray(existing)?existing:values);

  popup.innerHTML='';
  const sort=document.createElement('div');sort.className='ef-sort';
  const asc=document.createElement('button');asc.textContent='А → Я / по возрастанию';
  const desc=document.createElement('button');desc.textContent='Я → А / по убыванию';

  const sw=document.createElement('div');sw.className='ef-search-wrap';

  const sat=document.createElement('span');sat.textContent='(Выделить все)';

  const list=document.createElement('div');list.className='ef-values';
  const items=[];
  const frag=document.createDocumentFragment();
  values.forEach(v=>{
    const lab=document.createElement('label');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(v);cb.dataset.value=v;
    const sp=document.createElement('span');sp.className='ef-value-text';sp.textContent=v;
    lab.append(cb,sp);frag.appendChild(lab);items.push({lab,cb,v});
  });

  const footer=document.createElement('div');footer.className='ef-footer';
  const ok=document.createElement('button');ok.className='ef-ok';ok.textContent='OK';
  const cancel=document.createElement('button');cancel.textContent='Отмена';
  const reset=document.createElement('button');reset.className='ef-reset';reset.textContent='Сбросить';
  footer.append(ok,cancel,reset);popup.appendChild(footer);

  const refreshSelectAll=()=>{
    const visible=items.filter(x=>x.lab.style.display!=='none');
    sacb.checked=visible.length>0&&visible.every(x=>x.cb.checked);
    sacb.indeterminate=visible.some(x=>x.cb.checked)&&!sacb.checked;
  };
  refreshSelectAll();

  search.addEventListener('input',()=>{
    const q=search.value.trim().toLowerCase();
    items.forEach(x=>x.lab.style.display=!q||x.v.toLowerCase().includes(q)?'':'none');
    refreshSelectAll();
  });
  items.forEach(x=>x.cb.addEventListener('change',refreshSelectAll));
  sacb.addEventListener('change',()=>{
    items.filter(x=>x.lab.style.display!=='none').forEach(x=>x.cb.checked=sacb.checked);
    refreshSelectAll();
  });

  const applySort=dir=>{
    st.sort={col,dir};
    popup.classList.remove('open');
    applyExcelFilters(table,panel,filterKey);
  };
  asc.onclick=()=>applySort('asc');
  desc.onclick=()=>applySort('desc');

  const applyPopupFilter=()=>{
    const q=search.value.trim().toLowerCase();

    /* Если в строку поиска что-то введено, фильтруем именно по найденным
       значениям. Раньше скрытые поиском значения оставались отмеченными,
       поэтому после OK таблица фактически не фильтровалась. */
    const sourceItems=q
      ? items.filter(x=>x.lab.style.display!=='none')
      : items;

    const checked=sourceItems.filter(x=>x.cb.checked).map(x=>x.v);

    if(!q && checked.length===values.length){
      delete st.cols[String(col)];
    }else{
      st.cols[String(col)]={values:checked};
    }

    popup.classList.remove('open');
    applyExcelFilters(table,panel,filterKey);
  };

  ok.onclick=applyPopupFilter;

  /* Можно просто ввести артикул/SKU и нажать Enter — фильтр применится. */
  search.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      applyPopupFilter();
    }
  });
  reset.onclick=()=>{
    delete st.cols[String(col)];
    if(st.sort&&st.sort.col===col)st.sort=null;
    popup.classList.remove('open');
    applyExcelFilters(table,panel,filterKey);
  };
  cancel.onclick=()=>popup.classList.remove('open');

  popup.classList.add('open');
  const r=btn.getBoundingClientRect();
  const pw=310, margin=8;
  let left=Math.min(r.left,window.innerWidth-pw-margin);
  left=Math.max(margin,left);
  popup.style.left=left+'px';
  popup.style.top=Math.min(r.bottom+4,window.innerHeight-520)+'px';
  requestAnimationFrame(()=>search.focus());
}

function impNorm(v){
 return String(v??'').trim().toLowerCase().replace(/ё/g,'е')
   .replace(/[₽%(),.\/\\_-]+/g,' ').replace(/\s+/g,' ').trim();
}
function impNumber(v){
 if(v===null||v===undefined||v==='')return null;
 if(typeof v==='number')return Number.isFinite(v)?v:null;
 const s=String(v).replace(/\u00a0/g,' ').replace(/\s/g,'').replace(',','.').replace('%','');
 const x=Number(s); return Number.isFinite(x)?x:null;
}
function impMarkup(v){
 const x=impNumber(v); if(x===null)return null;
 if(typeof v==='string' && String(v).includes('%'))return x/100;
 return Math.abs(x)>2?x/100:x;
}
function impCtr(v){
 const x=impNumber(v); if(x===null)return null;
 if(typeof v==='string' && String(v).includes('%'))return x;
 return Math.abs(x)<=1?x*100:x;
}
function impFindSheet(wb,names){
 const wanted=names.map(impNorm);
 for(const name of wb.SheetNames){
   const n=impNorm(name);
   if(wanted.includes(n))return name;
 }
 return null;
}
function impRows(wb,names){
 const name=impFindSheet(wb,names);

function impFindHeader(rows,requiredAliases){
 for(let r=0;r<Math.min(rows.length,12);r++){
   const h=(rows[r]||[]).map(impNorm);
   let ok=true;
   for(const aliases of requiredAliases){
     if(!aliases.some(a=>h.some(x=>x===impNorm(a)||x.includes(impNorm(a))))){ok=false;break}
   }
   if(ok)return r;
 }
 return -1;
}
function impCol(headers,aliases){
 const h=headers.map(impNorm), aa=aliases.map(impNorm);
 for(let i=0;i<h.length;i++){
   if(aa.some(a=>h[i]===a||h[i].includes(a)))return i;
 }
 return -1;
}
function impPeriodDays(rows){
 for(let r=0;r<Math.min(rows.length,8);r++){
   for(let c=0;c<(rows[r]||[]).length;c++){
     const v=impNorm(rows[r][c]);
     if(v.includes('период')&&v.includes('дней')){
       const x=impNumber(rows[r][c+1]);
       if(x&&x>0)return x;
     }
   }
 }
 return 7;
}
function impSeasonEnd(rows){
 for(let r=0;r<Math.min(rows.length,8);r++){
   for(let c=0;c<(rows[r]||[]).length;c++){
     if(impNorm(rows[r][c]).includes('дата конца сезона')){
       return excelDateToISO(rows[r+1]?.[c] || rows[r]?.[c+1] || '');
     }
   }
 }
 return '';
}

function impStockDate(rows){
 for(let r=0;r<Math.min(rows.length,8);r++){
   for(let c=0;c<(rows[r]||[]).length;c++){
     if(impNorm(rows[r][c]).includes('дата остатков')){
       return excelDateToISO(rows[r][c+1] || rows[r+1]?.[c] || '');
     }
   }
 }
 return '';
}

   const hn=h.map(impNorm);

 }

 const savedOverrides=state.manualOverrides||{};
 const savedLocks=state.changeLocks||{};
 const matrixSrc=impRows(wb,['Матрица','01_Матрица']);

 if(!matrixSrc){
   throw new Error('Не найден лист «Матрица»');
 }

 const mr=matrixSrc.rows;
 const mh=impFindHeader(mr,[['артикул'],['sku'],['вп шт','вп/шт','валовая прибыль шт']]);
 if(mh<0)throw new Error('На листе «Матрица» не найдены колонки Артикул / SKU / ВП шт');

 const headers=mr[mh]||[];
 const mc={
   article:impCol(headers,['Артикул']),
   sku:impCol(headers,['SKU']),
   markup:impCol(headers,['Наценка','Наценка %']),
   manager:impCol(headers,['Менеджер']),
   marker:impCol(headers,['Маркер']),
   vp:impCol(headers,['ВП шт','ВП/шт','Валовая прибыль шт','Валовая прибыль / шт']),
   stock:impCol(headers,['Остаток FBO','Остаток ФБО','FBO','ФБО']),
   fbsStock:impCol(headers,['Остаток FBS','Остаток ФБС','FBS','ФБС'])
 };
 state.matrix=mr.slice(mh+1)
   .filter(r=>String(r[mc.article]??'').trim()||String(r[mc.sku]??'').trim())
   .map(r=>({
     article:String(r[mc.article]??'').trim(),
     sku:String(r[mc.sku]??'').trim(),
     markup:mc.markup>=0?impMarkup(r[mc.markup]):null,
     manager:mc.manager>=0?String(r[mc.manager]??'').trim():'',
     marker:mc.marker>=0?String(r[mc.marker]??'').trim().toUpperCase():'',
     grossProfitUnit:mc.vp>=0?impNumber(r[mc.vp]):null,
     stock:mc.stock>=0?(impNumber(r[mc.stock])||0):0,
     fbsStock:mc.fbsStock>=0?(impNumber(r[mc.fbsStock])||0):0
   }));

 const seasonEnd=impSeasonEnd(mr);
 if(seasonEnd)state.seasonEnd=seasonEnd;
 const matrixStockDate=impStockDate(mr);
 if(matrixStockDate)state.stockDate=matrixStockDate;

 /* Новый шаблон хранит FBO/FBS в Матрице. Для старых файлов без этих
    колонок всё ещё умеем один раз забрать остатки со старого листа «Остатки». */
 let stocksImportedFromLegacy=false;
 if(mc.stock<0){
   stocksImportedFromLegacy=impImportStocksFromWorkbook(wb);
   if(stocksImportedFromLegacy){
     state.matrix.forEach(p=>{
       const s=state.stocks.find(x=>String(x.article)===String(p.article))||state.stocks.find(x=>String(x.sku)===String(p.sku));
       p.stock=s?n(s.stock):0;
       p.fbsStock=s?n(s.fbsStock):0;
     });
   }
 }
 /* Держим legacy state.stocks синхронным только ради совместимости со старыми проектами. */
 state.stocks=state.matrix.map(p=>({article:p.article,sku:p.sku,stock:n(p.stock),fbsStock:n(p.fbsStock),date:state.stockDate||''}));

 const missing=[];
 for(let i=0;i<=4;i++){
   const aliases=i===0
     ? ['Неделя 0','Неделя_0','Неделя_0_ПредМес']
     : [`Неделя ${i}`,`Неделя_${i}`];
   const src=impRows(wb,aliases);
   if(!src){missing.push(`Неделя ${i}`);continue}

   const rows=src.rows;
   const hr=impFindHeader(rows,[['артикул'],['sku'],['заказы']]);
   if(hr<0){missing.push(`Неделя ${i} (нет заголовков)`);continue}

   const h=rows[hr]||[];
   const c={
     article:impCol(h,['Артикул']),
     sku:impCol(h,['SKU']),
     orders:impCol(h,['Заказы']),
     revenue:impCol(h,['Выручка']),
     adSpend:impCol(h,['Расход РК','Траты на рекламу','Рекламные расходы']),
     profit:impCol(h,['Прибыль периода после РК','Прибыль периода','Чистая прибыль']),
     ctr:impCol(h,['CTR']),
     budget:impCol(h,['Бюджет/нед','Бюджет нед','Недельный бюджет','Бюджет']),
     bid:impCol(h,['Ставка'])
   };

   const parsed=rows.slice(hr+1)
     .filter(r=>String(r[c.article]??'').trim()||String(r[c.sku]??'').trim())
     .map(r=>({
       article:String(r[c.article]??'').trim(),
       sku:String(r[c.sku]??'').trim(),
       orders:impNumber(r[c.orders])||0,
       revenue:impNumber(r[c.revenue])||0,
       adSpend:impNumber(r[c.adSpend])||0,
       profit:c.profit>=0?impNumber(r[c.profit]):null,
       ctr:c.ctr>=0?impCtr(r[c.ctr]):null,
       budget:c.budget>=0?(impNumber(r[c.budget])||0):0,
       bid:c.bid>=0?(impNumber(r[c.bid])||0):0,
       status:'',
       turnover:null,
       stock:null,
       manager:''
     }));

   state.weeks[String(i)]={
     title:`Неделя ${i}`,
     periodDays:impPeriodDays(rows),
     rows:parsed
   };
 }

 state.currentWeek=latestWeek();

 let msg=`Импортировано: ${state.matrix.length} товаров, остатки в Матрице`;
 if(stocksImportedFromLegacy)msg+=' (перенесены со старого листа «Остатки»)';
 if(missing.length)msg+=`. Проверь: ${missing.join(', ')}`;
 toast(msg);
}

document.getElementById('fileImport').addEventListener('change',e=>importFile(e.target.files[0]));
window.addEventListener('beforeunload',persist);
initTabs();recalcAll(false);
</script>

<script>
(function(){

  /* =======================================================
     1. УБИРАЕМ СТАРУЮ ВЕРХНЮЮ ПАНЕЛЬ
        И ПЕРЕНОСИМ ЕЁ КНОПКИ К ВКЛАДКАМ
     ======================================================= */

  function createWorkspaceBar(){

    if(document.querySelector('.workspace-bar')){
      return;
    }

    const tabs =
      document.getElementById('tabs');

    const oldTopbar =
      document.querySelector('.topbar');

    const actions =
      oldTopbar
        ? oldTopbar.querySelector('.top-actions')
        : null;

    if(!tabs || !oldTopbar || !actions){
      return;
    }


    /* создаём общий блок */

    const bar =
      document.createElement('div');

    bar.className =
      'workspace-bar';


    /* ставим туда, где раньше начинались вкладки */

    tabs.parentNode.insertBefore(
      bar,
      tabs
    );


    /* сначала вкладки */

    bar.appendChild(
      tabs
    );


    /* затем реальные старые кнопки.
       Мы именно ПЕРЕНОСИМ их, а не копируем,
       поэтому onclick и input импорта сохраняются. */

    bar.appendChild(
      actions
    );


    /* удаляем OZ + Озон маркетолог */

    oldTopbar.remove();

  }


  /* =======================================================
     2. STATUS SYSTEM
     ======================================================= */

  const statusClasses = [
    'status-up',
    'status-down',
    'status-hold',
    'status-lock',
    'status-off',
    'status-none',
    'status-recommend',
    'status-check',
    'status-neutral'
  ];


  function decorateStatusBadge(badge){

    const text =
      (badge.textContent || '')
        .trim()
        .toUpperCase();


    let cls =
      '';

    let icon =
      '';


    /* важен порядок проверок */


    if(
      text.includes('НЕ ТРОГАТЬ')
    ){
      cls =
        'status-lock';

      icon =
        '◆';
    }


    else if(
      text.includes('РК НЕ НУЖНА') ||
      text === 'НЕ В РК'
    ){
      cls =
        'status-none';

      icon =
        '○';
    }


    else if(
      text.includes('ВЫКЛ') ||
      text.includes('НЕТ ОСТАТКА') ||
      text.includes('ВЫВОД')
    ){
      cls =
        'status-off';

      icon =
        '×';
    }


    else if(
      text.includes('ПОВЫС') ||
      text.includes('РАЗГОН')
    ){
      cls =
        'status-up';

      icon =
        '↑';
    }


    else if(
      text.includes('СНИЗ') ||
      text.includes('ПОНИЗ')
    ){
      cls =
        'status-down';

      icon =
        '↓';
    }


    else if(
      text.includes('ОСТАВ') ||
      text.includes('ДЕРЖАТЬ')
    ){
      cls =
        'status-hold';

      icon =
        '—';
    }


    else if(
      text.includes('РЕКОМЕНД') ||
      text.includes('СТАРТ') ||
      text.includes('ЗАПУСК')
    ){
      cls =
        'status-recommend';

      icon =
        '✦';
    }


    else if(
      text.includes('ПРОВЕР') ||
      text.includes('УКАЗАТЬ') ||
      text === 'НАЦЕНКА'
    ){
      cls =
        'status-check';

      icon =
        '?';
    }


    else if(
      text === '—'
    ){
      cls =
        'status-neutral';

      icon =
        '—';
    }


    /* обычные badges типа НОВИНКА / СЕЗОН не трогаем */

    if(!cls){
      return;
    }


    badge.classList.remove(
      ...statusClasses
    );


    badge.classList.add(
      'status-system',
      cls
    );


    badge.setAttribute(
      'data-status-icon',
      icon
    );

  }


  function decorateAllStatuses(root){

    (root || document)
      .querySelectorAll('.badge')
      .forEach(
        decorateStatusBadge
      );

  }


  /* первый запуск */

  createWorkspaceBar();

  decorateAllStatuses(
    document
  );


  /* =======================================================
     3. ПРИ ПЕРЕКЛЮЧЕНИИ ВКЛАДКИ renderActive()
        пересоздаёт таблицу.
        Поэтому автоматически оформляем новые статусы.
     ======================================================= */

  const views =
    document.getElementById('views');


  if(views){

    const observer =
      new MutationObserver(function(){

        requestAnimationFrame(function(){

          decorateAllStatuses(
            views
          );

        });

      });


    observer.observe(
      views,
      {
        childList:true,
        subtree:true
      }
    );

  }


  /* статусы внутри боковой карточки SKU */

  const drawerBody =
    document.getElementById('drawerBody');


  if(drawerBody){

    const drawerObserver =
      new MutationObserver(function(){

        decorateAllStatuses(
          drawerBody
        );

      });


    drawerObserver.observe(
      drawerBody,
      {
        childList:true,
        subtree:true
      }
    );

  }

})();

<script>
/* Исправление логики действия по бюджету:
   действие зависит от разницы текущего и рекомендованного бюджета */
function fixBudgetAction(currentBudget, recommendedBudget, currentAction){
  const cur = Number(currentBudget)||0;
  const rec = Number(recommendedBudget)||0;

  if(cur > 0 && rec > 0){
    const diff = (rec-cur)/cur*100;

    if(diff <= -10) return 'СНИЗИТЬ';
    if(diff >= 10) return 'ПОВЫСИТЬ';
    return 'ОСТАВИТЬ';
  }

  return currentAction;
}
</script>

<script>
function budgetTextByAction(action, budgetText){
  const a = String(action||'').toUpperCase();

  if(a.includes('СНИЗ')){
    return 'Снизить бюджет до ' + budgetText;
  }
  if(a.includes('ПОВЫС')){
    return 'Повысить бюджет до ' + budgetText;
  }
  if(a.includes('ОСТАВ')){
    return 'Бюджет оставить ' + budgetText;
  }
  return budgetText;
}
</script>
